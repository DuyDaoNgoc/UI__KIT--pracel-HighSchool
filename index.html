<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="content-language" content="en" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="I’ve started to work in company at 2009. Photographs are a way of preserving a moment in our lives for the rest of our lives. Many of us have at least been tempted at the flashy array of photo printers which seemingly leap off the shelves at even the least tech-savvy. It surely seems old fashioned to talk about 35mm film and non-digital cameras in today’s day and age."
    />
    <meta name="theme-color" content="#ebcb80" />
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'" /> -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="robots" content="index, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./public/assets/icons/icon.png" />
    <link href="./src/stylesheets/base/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="./src/stylesheets/main.scss" />
    <title>Hofmann-UI-Kit-Page-Templates</title>
  </head>
  <body class="">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script src="./src/Components/settings/aos.js"></script>
    <script>
      AOS.init({
        duration: 800,
        delay: 100,
        once: true,
      });
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "itemListElement": [
          {
            "@type": "Review",
            "author": {
              "@type": "Person",
              "name": "Emily Rodriguez"
            },
            "reviewBody": "The flexible schedule allowed me to balance work and studies perfectly. The instructors were incredibly supportive and understanding of my commitments.",
            "reviewRating": {
              "@type": "Rating",
              "ratingValue": "5"
            }
          },
          {
            "@type": "Review",
            "author": {
              "@type": "Person",
              "name": "Michael Chen"
            },
            "reviewBody": "Enrolling in the part-time program was the best decision I made. I gained practical skills while maintaining my career, and the networking opportunities were invaluable.",
            "reviewRating": {
              "@type": "Rating",
              "ratingValue": "5"
            }
          },
          {
            "@type": "Review",
            "author": {
              "@type": "Person",
              "name": "Sarah Thompson"
            },
            "reviewBody": "As a working parent, the evening classes were perfect for me. The curriculum was engaging and directly applicable to my professional goals. Highly recommend!",
            "reviewRating": {
              "@type": "Rating",
              "ratingValue": "5"
            }
          },
          {
            "@type": "Review",
            "author": {
              "@type": "Person",
              "name": "David Patel"
            },
            "reviewBody": "The part-time program exceeded my expectations. The quality of education matched full-time programs, and I could immediately apply what I learned at work.",
            "reviewRating": {
              "@type": "Rating",
              "ratingValue": "5"
            }
          }
        ]
      }
    </script>

    <script>
      // Pagination functionality
      const paginationBtns = document.querySelectorAll(".items--btn");

      paginationBtns.forEach((btn, index) => {
        btn.addEventListener("click", () => {
          paginationBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          console.log(`Chuyển sang trang ${index + 1}`);
        });
      });

      // Card click handler
      const portfolioCards = document.querySelectorAll(".card__items");

      portfolioCards.forEach((card) => {
        card.addEventListener("click", () => {
          const img = card.querySelector("img");
          if (img) {
            console.log(`Clicked: ${img.alt}`);
          }
        });
      });
    </script>
  </body>
</html>
